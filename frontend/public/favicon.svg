<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sagaraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#6b11ff" />
    </linearGradient>
    <linearGradient id="sagaraCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Hexagon Frame -->
  <polygon points="256,32 448,144 448,368 256,480 64,368 64,144" fill="none" stroke="url(#sagaraGlow)" stroke-width="24" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Inner Neural Core Geometry -->
  <polygon points="256,96 384,176 384,336 256,416 128,336 128,176" fill="#0f172a" opacity="0.85" stroke="url(#sagaraGlow)" stroke-width="8"/>
  
  <!-- Stylized 'S' Agentic Circuit Ribbon -->
  <path d="M 340,160 L 220,160 C 170,160 160,210 210,240 L 302,272 C 352,300 340,352 290,352 L 172,352" 
        fill="none" 
        stroke="url(#sagaraGlow)" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Glowing AI Core Dots -->
  <circle cx="256" cy="256" r="28" fill="url(#sagaraGlow)" filter="url(#glow)"/>
  <circle cx="340" cy="160" r="14" fill="#00f2fe"/>
  <circle cx="172" cy="352" r="14" fill="#6b11ff"/>
</svg>
