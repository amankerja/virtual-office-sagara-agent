# Canonical Profiles Seed Specification
# Version: 1.0.0
# Description: Canonical 8-agent profile blueprint for Sagara AI fleet.

schema_version: "1.0.0"
version: 1

profiles:
  - id: lead
    name: Lead Coordinator
    role: Lead Agent / AI Team Manager
    description: Sagara Agent fleet coordinator, task triage director, and multi-agent workflow manager.
    enabled: true
    memory_namespace: profile:lead
    soul_template: lead.md
    delegation:
      can_delegate: true
      allowed_targets:
        - personal
        - business
        - marketing
        - cs
        - it-support
        - it-coding
        - sagara-lab
    configuration:
      risk_tier: HIGH
      approval_class: SUPERVISED
      configuration_state: COMPLETE

  - id: personal
    name: Personal Assistant
    role: Personal Assistant / Secretary
    description: Executive assistant for personal scheduling, calendar management, reminders, and email triage.
