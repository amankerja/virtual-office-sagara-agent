[project]
name = "sagara-mission-control-backend"
version = "0.1.0"
description = "FastAPI Backend Foundation for Sagara Mission Control"
authors = [{ name = "Sagara Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
python_files = ["test_*.py"]
markers = [
    "smoke: fast developer feedback smoke tests (foundational health, readiness, policy parsing, API contracts)",
    "security: security-critical invariants (authorization, proxy spoofing, drift, traversal, kill switch, audit)",
    "feature: feature-specific regression tests",
    "execution: execution engine, coordinator, and policy enforcement tests",
    "tool_security: tool broker, capability binding, resource scope, and sandbox tests",
    "realtime: realtime protocol, websocket, and backpressure tests",
    "contract: API contract and schema tests",
]


[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
